# The web entry point: the built frontend, and the ballot box behind /api and /auth.
server {
    listen 80;
    root /usr/share/nginx/html;

    # A ballot is ~34 KB per mix server; a cast sends one per question.
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://ballot-box:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://ballot-box:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed file names: cache for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app.
    location / {
        try_files $uri /index.html;
    }
}
