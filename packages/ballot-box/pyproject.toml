[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ballot-box"
version = "0.1.0"
description = "Main server: authentication, elections, voter registration, casting, bulletin board, mixnet coordination"
requires-python = ">=3.12"
dependencies = [
    "evmlr",
    "voting-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "authlib>=1.3",
    "python-cas>=1.6",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "cryptography>=44",
]

[tool.uv.sources]
evmlr = { workspace = true }
voting-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ballot_box"]
