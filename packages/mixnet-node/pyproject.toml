[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixnet-node"
version = "0.1.0"
description = "One mixing server: generates its own key, decrypts its layer, shuffles and proves"
requires-python = ">=3.12"
dependencies = [
    "evmlr",
    "voting-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "cryptography>=44",
]

[tool.uv.sources]
evmlr = { workspace = true }
voting-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mixnet_node"]
