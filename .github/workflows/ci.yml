name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same versions as wasm/build-deps.sh and the local toolchain.
  EMSDK_VERSION: 7.0.0
  GMP_VERSION: 6.3.0
  GMP_SHA256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898

jobs:
  python:
    name: Python (lint, tests on SQLite and Postgres)
    # ubuntu-latest (24.04) only packages FLINT 3.0.1; evmlr needs >= 3.2.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: voting
          POSTGRES_PASSWORD: voting
          POSTGRES_DB: voting
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voting" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install FLINT and GMP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libflint-dev libgmp-dev
      - uses: astral-sh/setup-uv@v6
      - name: Build libevmlr.so and the environment
        run: |
          make lib ARCH=
          uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check packages scripts
          uv run ruff format --check packages scripts
      - name: Tests (SQLite)
        run: uv run pytest
      - name: Ballot box tests (Postgres)
        env:
          BALLOT_BOX_TEST_DATABASE_URL: postgresql+psycopg://voting:voting@localhost:5432/voting
        run: uv run pytest packages/ballot-box

  frontend:
    name: Frontend (tests, types)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx vue-tsc --noEmit

  e2e:
    name: End to end (WebAssembly, Celery, headless Chromium)
    needs: [python, frontend]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install FLINT, GMP and m4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libflint-dev libgmp-dev m4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Cache the WebAssembly dependencies (GMP, MPFR, FLINT)
        id: wasm-deps
        uses: actions/cache@v4
        with:
          path: evmlr-shuffle/wasm/deps/prefix
          key: wasm-deps-${{ env.EMSDK_VERSION }}-${{ hashFiles('evmlr-shuffle/wasm/build-deps.sh') }}
      - name: Build the WebAssembly dependencies
        if: steps.wasm-deps.outputs.cache-hit != 'true'
        working-directory: evmlr-shuffle
        run: |
          # gmplib.org is often unreachable: take GMP from the GNU mirror, checked.
          mkdir -p wasm/deps/src
          curl -fsSL --retry 3 -o wasm/deps/src/gmp-$GMP_VERSION.tar.xz \
            https://ftpmirror.gnu.org/gmp/gmp-$GMP_VERSION.tar.xz
          echo "$GMP_SHA256  wasm/deps/src/gmp-$GMP_VERSION.tar.xz" | sha256sum -c -
          wasm/build-deps.sh
      - name: Build the WebAssembly module, libevmlr.so and the environments
        run: |
          make -C evmlr-shuffle -f Makefile.wasm lib -j"$(nproc)"
          make lib ARCH=
          uv sync --frozen
          (cd frontend && npm ci)
      - name: Production frontend build
        run: cd frontend && npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Smoke and browser tests against a local stack
        env:
          E2E_REDIS_URL: redis://localhost:6379/0
          E2E_BROWSER: "1"
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          TMPDIR: ${{ runner.temp }}
        run: scripts/e2e.sh
      - name: Keep the logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: ${{ runner.temp }}/mixnet-e2e.*
